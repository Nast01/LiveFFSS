name: live_ffss_v2
description: "FFSS-LIVE — suivi en direct des compétitions de sauvetage sportif (v2)."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  timezone: ^0.11.2

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

# Icône de l'application installée, tirée du logo (`assets/images/logo_ffss.png`)
# mis au carré dans `assets/icon/`. Régénérer : `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  # Icône adaptative d'Android 8+ : le paquet ajoute 16 % de marge, le logo
  # garde donc presque toute sa place dans `icon_foreground.png` ; il tient
  # ainsi dans tous les masques (rond, goutte, carré).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  # L'App Store refuse une icône transparente.
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
