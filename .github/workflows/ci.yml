# Les trois commandes qu'on lance à la main avant chaque commit, sur les deux
# applications : la v1 reste au vert tant que la v2 y puise du code.
name: CI

on:
  push:
    branches: [main, dev, val, dev_v2]
  pull_request:

# Une seule exécution par branche : un second push annule le premier plutôt
# que de faire la queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Fuseau de la FFSS : le test de changement d'heure du découpage de
    # l'accueil ne discrimine qu'avec un fuseau qui en a un (UTC n'en a pas).
    env:
      TZ: Europe/Paris
    strategy:
      fail-fast: false
      # Chaque application garde sa version de Flutter : la v1 est gelée en
      # 3.41.9, la v2 a monté en 3.47.7 (son pubspec.lock exige Dart 3.13).
      # Le poste de développement n'a qu'un SDK, sur la version de la v2 —
      # voir la ligne Outils du CLAUDE.md v2.
      matrix:
        include:
          - project: live_ffss
            flutter: 3.41.9
          - project: live_ffss.v2
            flutter: 3.47.7
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Avant analyze : un écart de formatage se corrige en une commande, et
      # le dire d'abord évite de lire un échec d'analyse pour une virgule.
      - name: dart format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
